---
modules:
  - type: systemd
    system:
      enabled:
        # Idle until someone signs the machine in to a tailnet. Core leaves
        # sshd off; Tailscale SSH covers remote help, and an edition that
        # needs an SSH server enables it.
        - tailscaled.service
        - shatteredvales-gpu-check.service
        # Finishes sv-migrate.sh moves by switching to the signed image.
        - shatteredvales-signed-switch.service
        # Copies the branded boot menu theme into /boot.
        - shatteredvales-grub-theme.service
    user:
      enabled:
        # Nudges people to restart when an update has waited 3+ days.
        - shatteredvales-update-reminder.timer
